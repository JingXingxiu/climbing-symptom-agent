ai:
  rag:
    enabled: ${AI_RAG_ENABLED:false}
    provider: ${AI_RAG_EMBEDDING_PROVIDER:}
    model: ${AI_RAG_EMBEDDING_MODEL:}
    dimensions: ${AI_RAG_EMBEDDING_DIMENSIONS:0}
    base-url: ${AI_RAG_EMBEDDING_BASE_URL:}
    api-key: ${AI_RAG_EMBEDDING_API_KEY:}

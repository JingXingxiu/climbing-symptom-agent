spring:
  application:
    name: gateway
  config:
    import: "nacos:${spring.application.name}-dev.yaml?group=CLIMBING_DEV&refreshEnabled=false"
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: CLIMBING_DEV
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: CLIMBING_DEV

# Must match base-service's signing settings. Routes live in gateway-dev.yaml in Nacos.
gateway:
  auth:
    secret: ${BASE_JWT_SECRET:}
    issuer: climbing-base-service
    audience: climbing-api
    clock-skew: 30s
  sentinel:
    enabled: ${GATEWAY_SENTINEL_ENABLED:false}
    agent-advance-qps: ${GATEWAY_AGENT_ADVANCE_QPS:2}
    image-upload-qps: ${GATEWAY_IMAGE_UPLOAD_QPS:5}
    dashboard: ${SENTINEL_DASHBOARD:}
    transport-port: ${SENTINEL_TRANSPORT_PORT:8719}
    client-ip: ${SENTINEL_CLIENT_IP:}

server:
  port: 8082

spring:
  datasource:
    url: "jdbc:postgresql://${BUSINESS_POSTGRES_HOST:127.0.0.1}:${BUSINESS_POSTGRES_PORT:5432}/image_db"
    username: "${BUSINESS_POSTGRES_USER:symptom_app}"
    password: "${BUSINESS_POSTGRES_PASSWORD:symptom_dev_only}"
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: image-service-pool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

image:
  storage:
    minio:
      endpoint: "${MINIO_ENDPOINT:http://127.0.0.1:9000}"
      access-key: "${MINIO_ACCESS_KEY:symptom_minio}"
      secret-key: "${MINIO_SECRET_KEY:symptom_minio_dev_only}"
      region: "${MINIO_REGION:us-east-1}"
      bucket: "${MINIO_BUCKET:symptom-pictures}"
      presigned-url-expiry-seconds: "${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:600}"

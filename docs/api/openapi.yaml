      summary: 恢复暂停或可重试失败任务
      description: 从当前 Checkpoint 恢复，已消耗的预算不重置；允许按期限接管超时的 RUNNING 执行。恢复为 CREATED 时由客户端再显式 advance。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentVersionRequest'
      responses:
        '200':
          description: 操作后当前 Session；不会隐式执行下一轮模型调用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/v1/agent-sessions/{sessionId}/cancel:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [AI / Agent]
      operationId: cancelAgentSession
      x-service-owner: ai-service
      summary: 取消本次分析
      description: 使旧执行失效并保留历史节点；取消后如需重新分析，创建带来源的新 Session。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentVersionRequest'
      responses:
        '200':
          description: 操作后当前 Session；不会隐式执行下一轮模型调用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/v1/agent-sessions/{sessionId}/revise-answer:

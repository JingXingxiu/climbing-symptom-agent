    post:
      tags: [Payment / Order]
      operationId: createPaymentOrder
      x-service-owner: payment-service
      summary: 幂等创建模拟套餐订单
      description: |
        只接收套餐编码，价格、额度和有效期由服务端读取并冻结在订单中。
        同一用户和幂等键重试返回原订单；同键更换套餐返回 409。
        PENDING 订单在创建后 30 分钟内允许模拟支付，不收取真实款项。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'

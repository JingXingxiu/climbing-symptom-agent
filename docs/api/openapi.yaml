  /api/ai/v1/agent-sessions/{sessionId}/responses:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [AI / Agent]
      operationId: answerAgentQuestion
      x-service-owner: ai-service
      summary: 保存当前问题的回答
      description: expectedVersion 与 baseCheckpointId 校验起点；重试复用幂等键。同键不同内容返回 409。接受回答后返回 CREATED，客户端显式 advance；幂等回放不会重新激活旧分支。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerAgentQuestionRequest'
      responses:
        '200':
          description: 操作后当前 Session；不会隐式执行下一轮模型调用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/v1/agent-sessions/{sessionId}/advance:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [AI / Agent]
      operationId: advanceAgentSession
      x-service-owner: ai-service
      x-client-timeout-ms: 150000
      summary: 显式执行至下一次用户等待或结果候选
      description: |
        先在事务外读取 Payment 权益，再在短事务原子预占用户每日额度、Session 预算并记录模型调用。
        模型调用在事务外执行，随后核对执行代次与起点提交结果。
        暂停或改答后的迟到响应不得推进任务。客户端每次业务动作只显式推进一次，等待上限 150 秒。
        HTTP 超时不自动重发 advance；保留 Session ID，先 GET 读取状态，超时执行由用户显式 resume 接管。
        失败不伪造成功，不自动无限重试，不回退 Mock。
        预占事务提交后调用失败仍计次；429 AI_DAILY_QUOTA_EXCEEDED 表示当日额度耗尽。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentVersionRequest'
      responses:
        '200':
          description: 操作后当前 Session；不会隐式执行下一轮模型调用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/v1/agent-sessions/{sessionId}/pause:
    parameters:

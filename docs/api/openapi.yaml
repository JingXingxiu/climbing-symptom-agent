        '201':
          description: 新建或幂等重放的订单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrderResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/payment/v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/PaymentOrderId'
    get:
      tags: [Payment / Order]
      operationId: getPaymentOrder
      x-service-owner: payment-service
      summary: 查询当前用户的单个订单
      description: 支付响应丢失时读取此接口确认状态；其他用户的订单返回 404。
      responses:
        '200':
          description: 当前订单快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrderResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payment/v1/orders/{orderId}/mock-pay:
    parameters:
      - $ref: '#/components/parameters/PaymentOrderId'
    post:
      tags: [Payment / Order]
      operationId: confirmMockPayment
      x-service-owner: payment-service
      summary: 开发环境模拟支付成功并开通权益
      description: |
        不连接第三方、不扣真实款项。要求显式 dev profile 且 payment.mock-enabled=true，
        prod/production 环境始终禁止；未启用返回 403 MOCK_PAYMENT_DISABLED。
        锁定当前用户订单；已 PAID 的订单直接返回，不重复开通。
        订单支付和权益开通在 payment_db 同一事务内完成。
        同用户不同订单通过权益行锁顺序续期；有效期从 max(当前时间, 原有效期) 延长。
        超过 expiresAt 的 PENDING 订单返回 409，不能由前端自行标为成功。
      responses:
        '200':
          description: 已支付订单（包含安全重放）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrderResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/payment/v1/entitlement:
    get:
      tags: [Payment / Entitlement]
      operationId: getPaymentEntitlement
      x-service-owner: payment-service
      summary: 查询当前用户的有效套餐权益
      description: 无购买记录或权益到期时返回 FREE，每日 10 次；当前 PLUS 为每日 50 次。
      responses:
        '200':
          description: 当前有效权益，不含 AI 已用次数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentEntitlementResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /internal/payment/entitlement:
    parameters:
      - $ref: '#/components/parameters/TrustedUserId'
    get:
      tags: [Payment / Internal]
      operationId: getInternalPaymentEntitlement
      x-service-owner: payment-service
      x-internal: true
      security: []
      servers:
        - url: http://localhost:8085
          description: 可信服务直连 payment-service；Gateway 不路由 /internal
      summary: AI 执行前读取当前用户的额度资格
      description: 必须部署在受限服务网络；X-User-Id 来自可信服务，不能接受外部客户端伪造。
      responses:
        '200':
          description: 与公共权益接口相同的当前有效权益
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentEntitlementResponse' }

  /api/ai/v1/quota:
    get:
      tags: [AI / Quota]
      operationId: getAgentDailyQuota
      x-service-owner: ai-service
      summary: 查询当前用户当天的模型执行额度
      description: |
        先在事务外查询 Payment 权益，再读取 AI 当日用量；查询本身不扣额度。
        业务日期按 Asia/Shanghai。所有 Session 共享每日使用量，续购不清零当日计数。
        advance 的执行预占事务使用条件 upsert 原子扣额度；提交后即使图片或模型失败仍计次，
        事务回滚不计次。额度耗尽返回 429 AI_DAILY_QUOTA_EXCEEDED；每 Session 预算仍独立保留。
        Payment 不可用时返回 503，不降级为无限额度。
      responses:
        '200':
          description: 当前资格、上海日期和剩余用量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentQuotaResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TrustedUserId:
      name: X-User-Id
      in: header
      required: true
      description: 可信内部调用链传递的当前用户 UUID；必须在受限服务网络内使用，不能由外部客户端自行声明。
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: 客户端为一次业务意图生成的 UUID；安全重试必须复用同一个值。
      schema: { type: string, format: uuid }
    PictureId:
      name: pictureId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentOrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: 请求格式或字段非法
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: 未登录或凭证失效
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 账号已禁用或当前操作被禁止
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: 上游响应异常
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: 必要配置缺失或上游暂时不可用
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 资源不存在或当前用户无权访问
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 幂等键冲突、版本冲突或状态不允许
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: 语法正确但缺少推进业务所需的信息
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: 文件超过服务端限制
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: 不支持的图片格式
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: 请求过于频繁或当天 AI 模型执行额度已耗尽
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    CreatePaymentOrderRequest:
      type: object
      additionalProperties: false
      required: [planCode]
      properties:
        planCode: { type: string, minLength: 1, maxLength: 40, examples: [PLUS] }

    PaymentPlanResponse:
      type: object
      required: [planCode, name, priceCents, currency, durationDays, dailyModelCallLimit]
      properties:
        planCode: { type: string, examples: [PLUS] }
        name: { type: string }
        priceCents: { type: integer, minimum: 1, description: 演示价格，单位为分，不实际扣款 }
        currency: { type: string, enum: [CNY] }
        durationDays: { type: integer, minimum: 1 }
        dailyModelCallLimit: { type: integer, minimum: 1 }

    PaymentOrderResponse:
      type: object
      required:
        [orderId, planCode, planName, priceCents, currency, durationDays,
         dailyModelCallLimit, status, expiresAt, paidAt, createdAt, updatedAt]
      properties:
        orderId: { type: string, format: uuid }
        planCode: { type: string }
        planName: { type: string }
        priceCents: { type: integer, minimum: 1 }
        currency: { type: string, enum: [CNY] }
        durationDays: { type: integer, minimum: 1 }
        dailyModelCallLimit: { type: integer, minimum: 1 }
        status: { type: string, enum: [PENDING, PAID] }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PaymentEntitlementResponse:
      type: object
      required: [userId, planCode, planName, dailyModelCallLimit, validUntil]
      properties:
        userId: { type: string, format: uuid }
        planCode: { type: string, examples: [FREE, PLUS] }
        planName: { type: string }
        dailyModelCallLimit: { type: integer, minimum: 1 }
        validUntil: { type: [string, 'null'], format: date-time }

    AgentQuotaResponse:
      type: object
      required:
        [userId, usageDate, zoneId, planCode, usedModelCalls,
         dailyModelCallLimit, remainingModelCalls, entitlementValidUntil]
      properties:
        userId: { type: string, format: uuid }
        usageDate: { type: string, format: date }
        zoneId: { type: string, enum: [Asia/Shanghai] }
        planCode: { type: string }
        usedModelCalls: { type: integer, minimum: 0 }
        dailyModelCallLimit: { type: integer, minimum: 1 }
        remainingModelCalls: { type: integer, minimum: 0 }
        entitlementValidUntil: { type: [string, 'null'], format: date-time }

    WechatLoginRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 256 }
        displayName: { type: [string, 'null'], maxLength: 60 }
        avatarUrl: { type: [string, 'null'], format: uri, maxLength: 1000 }

    AuthSessionResponse:
      type: object
      required: [accessToken, expiresInSeconds, user]
      properties:
        accessToken: { type: string }
        expiresInSeconds: { type: integer, minimum: 1 }
        user: { $ref: '#/components/schemas/UserProfileResponse' }

    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]

    UserProfileResponse:
      type: object
      required: [userId, status, version, createdAt, updatedAt]
      properties:
        userId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/UserStatus' }
        displayName: { type: [string, 'null'], maxLength: 80 }
        avatarPictureId: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpdateUserProfileRequest:
      type: object
      description: 未提供字段保留，显式 null 清空；version 为当前资料版本。
      additionalProperties: false
      required: [version]
      properties:
        displayName: { type: [string, 'null'], maxLength: 80 }
        avatarPictureId: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 1 }

    VisualSourceType:
      type: string
      enum: [MODEL_SNAPSHOT, STANDARD_REFERENCE, USER_UPLOAD]

    StandardPictureView:
      type: string
      enum: [PALMAR, DORSAL, SIDE]

    PictureUploadStatus:
      type: string
      enum: [INITIATED, UPLOADED, AVAILABLE, FAILED, DELETED]

    PictureProcessingStatus:
      type: string
      enum: [PENDING, PROCESSING, SUCCEEDED, PARTIAL, FAILED, NOT_REQUIRED]

    CoordinateSpace:
      type: string
      enum: [NORMALIZED_0_1]

    AnnotationShapeType:
      type: string
      enum: [POINT, CIRCLE, POLYLINE, POLYGON]

    ResolveVisualReferencesRequest:
      type: object
      additionalProperties: false
      required: [assessmentId, pictureIds]
      properties:
        assessmentId: { type: string, format: uuid }
        pictureIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items: { type: string, format: uuid }

    ResolvedVisualReference:
      type: object
      required: [pictureId, sourceType, annotationSetId]
      properties:
        pictureId: { type: string, format: uuid }
        sourceType: { $ref: '#/components/schemas/VisualSourceType' }
        annotationSetId: { type: [string, 'null'], format: uuid }

    PictureUploadMetadata:
      type: object
      additionalProperties: false
      required: [sourceType, clientRequestId]
      properties:
        sourceType: { $ref: '#/components/schemas/VisualSourceType' }
        clientRequestId: { type: string, format: uuid }
        assessmentId: { type: [string, 'null'], format: uuid }
        viewState:
          oneOf:
            - $ref: '#/components/schemas/ViewState3D'
            - type: 'null'
        userNote: { type: [string, 'null'], maxLength: 500 }

    ViewState3D:
      type: object
      additionalProperties: false
      required: [modelAssetVersion, camera, target, zoom]
      properties:
        modelAssetVersion: { type: string, maxLength: 80 }
        camera: { $ref: '#/components/schemas/Vector3' }
        target: { $ref: '#/components/schemas/Vector3' }
        up: { $ref: '#/components/schemas/Vector3' }
        zoom: { type: number, exclusiveMinimum: 0 }
        coarseRegionId: { type: [string, 'null'], maxLength: 100 }
        implementationHit:
          type: [object, 'null']
          additionalProperties: true
          description: 可选的 triangle/mesh/UV 调试数据，不是 AI 必须理解的业务字段。

    Vector3:
      type: object
      additionalProperties: false
      required: [x, y, z]
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }

    PictureResponse:
      type: object
      required:
        [pictureId, ownerUserId, sourceType, mediaType, byteSize, uploadStatus,
         processingStatus, createdAt, updatedAt]
      properties:
        pictureId: { type: string, format: uuid }
        ownerUserId: { type: [string, 'null'], format: uuid, description: 系统标准图片没有用户 owner。 }
        sourceType: { $ref: '#/components/schemas/VisualSourceType' }
        standardAssetKey: { type: [string, 'null'], maxLength: 100 }
        standardHandSide:
          oneOf:
            - $ref: '#/components/schemas/HandSide'
            - type: 'null'
        standardView:
          oneOf:
            - $ref: '#/components/schemas/StandardPictureView'
            - type: 'null'
        originalFilename: { type: [string, 'null'] }
        mediaType: { type: string, examples: [image/jpeg] }
        byteSize: { type: integer, minimum: 1 }
        width: { type: [integer, 'null'], minimum: 1 }
        height: { type: [integer, 'null'], minimum: 1 }
        uploadStatus: { $ref: '#/components/schemas/PictureUploadStatus' }
        processingStatus: { $ref: '#/components/schemas/PictureProcessingStatus' }
        originalUrl:
          type: [string, 'null']
          format: uri
          description: 短期签名 URL；不要持久化到业务表。
        thumbnailUrl: { type: [string, 'null'], format: uri }
        viewState:
          oneOf:
            - $ref: '#/components/schemas/ViewState3D'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AnnotationSetResponse:
      type: object
      required:
        [annotationSetId, pictureId, coordinateSpace, sourceWidth, sourceHeight,
         shapes, version, updatedAt]
      properties:
        annotationSetId: { type: string, format: uuid }
        pictureId: { type: string, format: uuid }
        coordinateSpace: { $ref: '#/components/schemas/CoordinateSpace' }
        sourceWidth: { type: integer, minimum: 1 }
        sourceHeight: { type: integer, minimum: 1 }
        shapes:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AnnotationShape' }
        note: { type: [string, 'null'], maxLength: 1000 }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }

    ReplaceAnnotationSetRequest:
      type: object
      additionalProperties: false
      required: [assessmentId, sourceWidth, sourceHeight, shapes, version]
      properties:
        assessmentId: { type: string, format: uuid }
        sourceWidth: { type: integer, minimum: 1 }
        sourceHeight: { type: integer, minimum: 1 }
        shapes:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AnnotationShape' }
        note: { type: [string, 'null'], maxLength: 1000 }
        version:
          type: integer
          minimum: 0
          description: 传 0 表示首次创建；已有标注集必须传当前版本。

    AnnotationShape:
      type: object
      additionalProperties: false
      required: [shapeId, type, geometry]
      properties:
        shapeId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/AnnotationShapeType' }
        geometry:
          oneOf:
            - $ref: '#/components/schemas/PointGeometry'
            - $ref: '#/components/schemas/CircleGeometry'
            - $ref: '#/components/schemas/PathGeometry'
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', default: '#E5484D' }
        lineWidthNormalized:
          type: number
          exclusiveMinimum: 0
          maximum: 0.05
          default: 0.006
        label: { type: [string, 'null'], maxLength: 120 }

    NormalizedPoint:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }

    PointGeometry:
      type: object
      additionalProperties: false
      required: [kind, point]
      properties:
        kind: { type: string, const: point }
        point: { $ref: '#/components/schemas/NormalizedPoint' }

    CircleGeometry:
      type: object
      additionalProperties: false
      required: [kind, center, radiusX, radiusY]
      properties:
        kind: { type: string, const: circle }
        center: { $ref: '#/components/schemas/NormalizedPoint' }
        radiusX: { type: number, exclusiveMinimum: 0, maximum: 1 }
        radiusY: { type: number, exclusiveMinimum: 0, maximum: 1 }

    PathGeometry:
      type: object
      additionalProperties: false
      required: [kind, points]
      properties:
        kind: { type: string, enum: [polyline, polygon] }
        points:
          type: array
          minItems: 2
          maxItems: 2000
          items: { $ref: '#/components/schemas/NormalizedPoint' }

    AssessmentStatus:
      type: string
      enum: [DRAFT, COLLECTING, CLARIFYING, COMPLETED, CANCELLED]

    HandSide:
      type: string
      enum: [LEFT, RIGHT]

    CurrentStepKey:
      type: string
      enum: [BASIC_INPUT, LOCATION_3D, VISUAL_ANNOTATION, AGENT, RESULT]

    OnsetKind:
      type: string
      enum: [TODAY, DAYS_AGO, WEEKS_AGO, MONTHS_AGO, EXACT_DATE, UNKNOWN]

    FingerCode:
      type: string
      enum: [THUMB, INDEX, MIDDLE, RING, LITTLE]

    JointCode:
      type: string
      enum: [TIP, DIP, PIP, MCP, CMC]

    RecommendationLevel:
      type: string
      enum: [SELF_MONITOR, ROUTINE_PROFESSIONAL, PROMPT_PROFESSIONAL, URGENT]

    NormalUseImpact:
      type: string
      enum: [NONE, MILD, MODERATE, SEVERE, UNKNOWN]

    AssessmentAnswerSource:
      type: string
      enum: [INITIAL_FORM, MOCK_AGENT, AI_AGENT, USER_CORRECTION]

    ResultGeneratedBy:
      type: string
      enum: [MOCK, RULE, AI]

    SymptomType:
      type: string
      description: |
        用户可多选的主观症状类型：疼痛、酸痛、发胀、麻木、肿胀、无力、僵硬，
        或其他/暂时说不清。它帮助表达，不代表医学诊断。
      enum:
        [PAIN, ACHING, DISTENSION, NUMBNESS, SWELLING, WEAKNESS, STIFFNESS, OTHER_UNCERTAIN]

    InitialSymptomDetails:
      type: object
      additionalProperties: false
      required: [handSide, onsetKind, activityContext, normalUseImpact]
      properties:
        handSide: { $ref: '#/components/schemas/HandSide' }
        symptomTypes:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          description: 可选多选；用户暂时无法判断时可选择 OTHER_UNCERTAIN。
          examples: [[PAIN, NUMBNESS]]
          items: { $ref: '#/components/schemas/SymptomType' }
        onsetKind: { $ref: '#/components/schemas/OnsetKind' }
        onsetAmount:
          type: [integer, 'null']
          minimum: 1
          description: DAYS_AGO、WEEKS_AGO 或 MONTHS_AGO 时保存用户输入的原始相对数量。
        onsetDate:
          type: [string, 'null']
          format: date
          description: EXACT_DATE 时使用。
        onsetText:
          type: [string, 'null']
          maxLength: 200
          description: 用户关于开始时间的原始补充文字，用于恢复原输入。
        activityContext:
          type: string
          minLength: 1
          maxLength: 500
          description: 哪个动作或情况下最明显。
        normalUseImpact: { $ref: '#/components/schemas/NormalUseImpact' }
        userNote: { type: [string, 'null'], maxLength: 2000 }

    CreateAssessmentRequest:
      type: object
      additionalProperties: false
      properties:
        initialInput:
          oneOf:
            - $ref: '#/components/schemas/InitialSymptomDetails'
            - type: 'null'

    UpdateAssessmentBasicsRequest:
      type: object
      additionalProperties: false
      required: [initialInput, version]
      properties:
        initialInput: { $ref: '#/components/schemas/InitialSymptomDetails' }
        currentStepKey:
          oneOf:
            - $ref: '#/components/schemas/CurrentStepKey'
            - type: 'null'
        version: { type: integer, minimum: 1 }

    SymptomLocationResponse:
      type: object
      required: [locationId, handSide, regionId, displayLabel, selectedAt]
      properties:
        locationId: { type: string, format: uuid }
        handSide: { $ref: '#/components/schemas/HandSide' }
        regionId:
          type: string
          pattern: '^hand\.(left|right)\.[a-z0-9.-]+$'
          examples: [hand.right.middle.pip]
        displayLabel: { type: string, examples: [右手 · 中指 · PIP 附近] }
        fingerCode:
          oneOf:
            - $ref: '#/components/schemas/FingerCode'
            - type: 'null'
        jointCode:
          oneOf:
            - $ref: '#/components/schemas/JointCode'
            - type: 'null'
        detailNote: { type: [string, 'null'], maxLength: 500 }
        selectedAt: { type: string, format: date-time }

    SymptomLocationInput:
      type: object
      additionalProperties: false
      required: [handSide, regionId, displayLabel]
      properties:
        handSide: { $ref: '#/components/schemas/HandSide' }
        regionId: { type: string, pattern: '^hand\.(left|right)\.[a-z0-9.-]+$' }
        displayLabel: { type: string, maxLength: 120 }
        fingerCode:
          oneOf:
            - $ref: '#/components/schemas/FingerCode'
            - type: 'null'
        jointCode:
          oneOf:
            - $ref: '#/components/schemas/JointCode'
            - type: 'null'
        detailNote: { type: [string, 'null'], maxLength: 500 }

    ReplaceSymptomLocationsRequest:
      type: object
      additionalProperties: false
      required: [symptomLocations]
      properties:
        symptomLocations:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SymptomLocationInput' }

    ReplaceVisualReferencesRequest:
      type: object
      additionalProperties: false
      required: [pictureIds, version]
      properties:
        pictureIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items: { type: string, format: uuid }
        version:
          type: integer
          minimum: 1

    VisualReference:
      type: object
      required: [pictureId, sourceType, sortOrder]
      properties:
        pictureId: { type: string, format: uuid }
        sourceType: { $ref: '#/components/schemas/VisualSourceType' }
        annotationSetId: { type: [string, 'null'], format: uuid }
        sortOrder: { type: integer, minimum: 0 }

    AssessmentAnswerResponse:
      type: object
      required: [answerId, clientAnswerId, sequenceNumber, questionKey, answer, source, createdAt]
      properties:
        answerId: { type: string, format: uuid }
        clientAnswerId: { type: string, format: uuid }
        sequenceNumber: { type: integer, minimum: 1 }
        questionKey: { type: string }
        questionText: { type: [string, 'null'] }
        answer: { type: [object, array, string, number, boolean] }
        source: { $ref: '#/components/schemas/AssessmentAnswerSource' }
        createdAt: { type: string, format: date-time }

    AppendAssessmentAnswerRequest:
      type: object
      additionalProperties: false
      required: [clientAnswerId, sequenceNumber, questionKey, answer, source]
      properties:
        clientAnswerId: { type: string, format: uuid }
        sequenceNumber: { type: integer, minimum: 1 }
        questionKey:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{1,79}$'
        questionText: { type: [string, 'null'], maxLength: 500 }
        answer: { type: [object, array, string, number, boolean] }
        source: { $ref: '#/components/schemas/AssessmentAnswerSource' }

    SubmitAssessmentRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: 客户端最后读取到的 Assessment.version，用于提交状态转换的乐观并发控制。

    AssessmentResponse:
      type: object
      required:
        [assessmentId, userId, status, symptomLocations, visualReferences, answers,
         currentStepKey, version, createdAt, updatedAt]
      properties:
        assessmentId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AssessmentStatus' }
        initialInput:
          oneOf:
            - $ref: '#/components/schemas/InitialSymptomDetails'
            - type: 'null'
        symptomLocations:
          type: array
          items: { $ref: '#/components/schemas/SymptomLocationResponse' }
        visualReferences:
          type: array
          items: { $ref: '#/components/schemas/VisualReference' }
        answers:
          type: array
          items: { $ref: '#/components/schemas/AssessmentAnswerResponse' }
        currentStepKey: { $ref: '#/components/schemas/CurrentStepKey' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }

    AssessmentSummary:
      type: object
      required: [assessmentId, status, updatedAt]
      properties:
        assessmentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AssessmentStatus' }
        handSide:
          oneOf:
            - $ref: '#/components/schemas/HandSide'
            - type: 'null'
        locationLabel: { type: [string, 'null'] }
        activityContext: { type: [string, 'null'] }
        recommendationLevel:
          oneOf:
            - $ref: '#/components/schemas/RecommendationLevel'
            - type: 'null'
        updatedAt: { type: string, format: date-time }

    AssessmentPageResponse:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssessmentSummary' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    AssessmentResumeResponse:
      type: object
      required: [assessment, currentStepKey]
      properties:
        assessment: { $ref: '#/components/schemas/AssessmentResponse' }
        currentStepKey: { $ref: '#/components/schemas/CurrentStepKey' }
        activeAgentSessionId: { type: [string, 'null'], format: uuid }

    AssessmentResultResponse:
      type: object
      required:
        [assessmentId, recommendationLevel, summary, reasons, suggestedNextActions,
         warningSigns, safetyNotice, generatedBy, finalizedAt]
      properties:
        assessmentId: { type: string, format: uuid }
        recommendationLevel: { $ref: '#/components/schemas/RecommendationLevel' }
        summary: { type: string, maxLength: 2000 }
        reasons:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
        suggestedNextActions:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
        warningSigns:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
        safetyNotice:
          type: string
          description: 必须明确“不是医学诊断”；紧急信号应提示及时寻求专业帮助。
        generatedBy: { $ref: '#/components/schemas/ResultGeneratedBy' }
        finalizedAt: { type: string, format: date-time }

    ResolveAgentPicturesRequest:
      type: object
      additionalProperties: false
      required: [assessmentId, pictureIds]
      properties:
        assessmentId: { type: string, format: uuid }
        pictureIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items: { type: string, format: uuid }

    ResolvedAgentPicture:
      type: object
      required: [pictureId, sourceType, mediaType, width, height, viewState, annotation, originalUrl]
      properties:
        pictureId: { type: string, format: uuid }
        sourceType: { $ref: '#/components/schemas/VisualSourceType' }
        mediaType: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        viewState:
          oneOf:
            - $ref: '#/components/schemas/ViewState3D'
            - type: 'null'
        annotation:
          oneOf:
            - $ref: '#/components/schemas/AnnotationSetResponse'
            - type: 'null'
        originalUrl:
          type: string
          format: uri
          description: 临时 GET 签名，禁止作为持久化图片身份或写入 AI 输入快照。

    AgentAssessmentInputResponse:
      type: object
      required: [assessmentId, userId, assessmentVersion, submittedAt, assessmentInputFingerprint, assessment]
      properties:
        assessmentId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        assessmentVersion: { type: integer, minimum: 1 }
        submittedAt: { type: string, format: date-time }
        assessmentInputFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        assessment: { $ref: '#/components/schemas/AssessmentResponse' }

    FinalizeAgentResultRequest:
      type: object
      additionalProperties: false
      required:
        [sessionId, stepId, checkpointId, attemptNo, recommendationLevel, summary, reasons,
         suggestedNextActions, warningSigns, safetyNotice, finalizedAt, workflowVersion,
         generatedBy, assessmentInputFingerprint]
      properties:
        sessionId: { type: string, format: uuid }
        stepId: { type: string, format: uuid }
        checkpointId: { type: string, format: uuid }
        attemptNo: { type: integer, minimum: 1 }
        recommendationLevel: { $ref: '#/components/schemas/RecommendationLevel' }
        summary: { type: string, minLength: 1, maxLength: 2000 }
        reasons:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
        suggestedNextActions:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
        warningSigns:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
        safetyNotice: { type: string, minLength: 1, maxLength: 1000 }
        finalizedAt: { type: string, format: date-time }
        workflowVersion: { type: string, minLength: 1, maxLength: 120 }
        generatedBy: { type: string, enum: [MOCK, AI] }
        assessmentInputFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }

    FinalizedAgentResultResponse:
      type: object
      required: [resultId, revisionNo, finalizedAt]
      properties:
        resultId: { type: string, format: uuid }
        revisionNo: { type: integer, minimum: 1 }
        finalizedAt: { type: string, format: date-time }

    CreateAgentSessionRequest:
      type: object
      additionalProperties: false
      required: [assessmentId]
      properties:
        assessmentId: { type: string, format: uuid }
        preferredLocale: { type: [string, 'null'], default: zh-CN, maxLength: 20 }
        modelProvider: { type: [string, 'null'], maxLength: 80 }
        modelName: { type: [string, 'null'], maxLength: 120 }
        sourceSessionId: { type: [string, 'null'], format: uuid }
        sourceCheckpointId: { type: [string, 'null'], format: uuid }

    AgentVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }

    ReviseAgentAnswerRequest:
      type: object
      additionalProperties: false
      required: [answerStepId, answer, expectedVersion]
      properties:
        answerStepId: { type: string, format: uuid }
        answer: {}
        expectedVersion: { type: integer, format: int64, minimum: 1 }

    ChangeAgentModelRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, provider, model]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }

    AgentSessionStatus:
      type: string
      enum: [CREATED, RUNNING, WAITING_FOR_USER, PAUSED, COMPLETED, FAILED, CANCELLED]

    AgentBehavior:
      type: string
      enum: [NARROW_DOWN, CLARIFY_CONTRADICTION, PRODUCE_RESULT]

    AgentAnswerType:
      type: string
      enum: [SINGLE_CHOICE, MULTI_CHOICE, BOOLEAN, TEXT]

    AgentStepType:
      type: string
      enum:
        [USER_INPUT, EXTRACT_INFORMATION, NARROW_DOWN, DETECT_CONTRADICTION,
         REQUEST_CONFIRMATION, OUTPUT_RESULT]

    AgentQuestionOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }

    AgentQuestion:
      type: object
      required: [questionId, questionKey, prompt, answerType, required]
      properties:
        questionId: { type: string, format: uuid }
        questionKey: { type: string }
        prompt: { type: string }
        helpText: { type: [string, 'null'] }
        answerType: { $ref: '#/components/schemas/AgentAnswerType' }
        options:
          type: array
          items: { $ref: '#/components/schemas/AgentQuestionOption' }
        required: { type: boolean }

    AgentSessionResponse:
      type: object
      required:
        [sessionId, assessmentId, status, currentStepNumber, recentSteps, updatedAt,
         version, activeCheckpointId, modelProvider, modelName, totalModelCalls, maxModelCalls, maxSteps]
      properties:
        sessionId: { type: string, format: uuid }
        assessmentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AgentSessionStatus' }
        currentStepNumber: { type: integer, minimum: 0 }
        behavior:
          oneOf:
            - $ref: '#/components/schemas/AgentBehavior'
            - type: 'null'
        question:
          oneOf:
            - $ref: '#/components/schemas/AgentQuestion'
            - type: 'null'
        recentSteps:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AgentStepSummary' }
        terminationReason: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }

        version: { type: integer, format: int64, minimum: 1 }
        activeCheckpointId: { type: string, format: uuid }
        modelProvider: { type: string }
        modelName: { type: string }
        totalModelCalls: { type: integer, minimum: 0 }
        maxModelCalls: { type: integer, minimum: 1 }
        maxSteps: { type: integer, minimum: 1 }

    AgentStepSummary:
      type: object
      required: [stepNumber, stepType, message, createdAt, stepId, parentStepId, status]
      properties:
        stepNumber: { type: integer, minimum: 1 }
        stepType: { $ref: '#/components/schemas/AgentStepType' }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        stepId: { type: string, format: uuid }
        parentStepId: { type: [string, 'null'], format: uuid }
        status:
          type: string
          enum: [STARTED, WAITING, COMPLETED, FAILED, DISCARDED]

    AnswerAgentQuestionRequest:
      type: object
      additionalProperties: false
      required: [questionId, answer, expectedVersion, baseCheckpointId]
      properties:
        questionId: { type: string, format: uuid }
        answer: {}
        expectedStepNumber: { type: [integer, 'null'], minimum: 0 }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        baseCheckpointId: { type: string, format: uuid }

    AgentFinalizationResponse:
      type: object
      required: [assessmentId, sessionId, resultId, revisionNo, finalizedAt]
      properties:
        assessmentId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        resultId: { type: string, format: uuid }
        revisionNo: { type: integer, minimum: 1 }
        finalizedAt: { type: string, format: date-time }

    AgentOutcomeResponse:
      type: object
      required:
        [sessionId, assessmentId, recommendationLevel, summary, reasons,
         suggestedNextActions, warningSigns, safetyNotice, finalizedAt]
      properties:
        sessionId: { type: string, format: uuid }
        assessmentId: { type: string, format: uuid }
        recommendationLevel: { $ref: '#/components/schemas/RecommendationLevel' }
        summary: { type: string }
        reasons: { type: array, items: { type: string } }
        suggestedNextActions: { type: array, items: { type: string } }
        warningSigns: { type: array, items: { type: string } }
        safetyNotice: { type: string }
        finalizedAt: { type: string, format: date-time }
        uncertaintyNote: { type: [string, 'null'] }

    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, examples: [ASSESSMENT_VERSION_CONFLICT] }
        detail: { type: [string, 'null'] }
        instance: { type: [string, 'null'], format: uri-reference }
        traceId: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

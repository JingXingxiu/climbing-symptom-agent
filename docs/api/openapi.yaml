      summary: 将已完成结果幂等提交到 History
      description: |
        按已完成 Session 的结果快照提交。此操作不更改 AI 当前分支，因此无 expectedVersion 请求体。
        History 在本地事务中保存结果历史、更新当前结果与 Assessment 状态。
        重试同一 Session 不生成第二份结果；跨服务失败可显式重试，不伪装成跨库原子事务。
      responses:
        '200':

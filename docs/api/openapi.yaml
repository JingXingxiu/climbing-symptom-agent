openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AI 手部症状辅助分析系统 API Contract
  version: 0.2.0
  description: |
    面向微信小程序 MVP 的契约先行接口。契约按 `base-service`、`image-service`、
    `history-service`、`ai-service`、`payment-service` 标明数据所有权，但不规定服务间调用方向、
    OpenFeign、重试、熔断、降级或 MQ 编排。

    本系统只帮助用户结构化表达手部不适症状（包括疼痛、麻木、肿胀等）并给出
    是否值得进一步寻求专业帮助的提示，不提供医学诊断。
    `ai-service` 提供有限步骤分析、暂停恢复、历史改答和结果定稿接口。
    前端默认仍使用本地 Mock；HTTP Adapter 显式调用 advance，不在失败时退回 Mock。
    Gateway 的分析执行与图片上传分组采用 Sentinel 限流，拒绝返回 429 GATEWAY_RATE_LIMITED；
    它区别于 AI_DAILY_QUOTA_EXCEEDED。AI 到 Payment 权益读取熔断时返回
    503 PAYMENT_ENTITLEMENT_UNAVAILABLE，不返回免费权益或执行模型。
servers:
  - url: http://localhost:8080
    description: 本地 Gateway（启动后可在 Swagger UI 中直接调试）
  - url: https://api.example.invalid
    description: Gateway 占位地址，部署时替换
tags:
  - name: Base / Auth
    description: base-service｜登录
  - name: Base / User
    description: base-service｜用户账号与基础资料
  - name: Image / Picture
    description: image-service｜MinIO 对象元数据与图片处理状态
  - name: Image / Annotation
    description: image-service｜归一化图片标注
  - name: Image / Internal
    description: image-service｜服务间批量查询，不经 Gateway 对外路由
  - name: History / Assessment
    description: history-service｜Assessment、恢复与症状历史
  - name: History / Result
    description: history-service｜最终业务结果
  - name: History / Internal
    description: history-service｜可信服务间的输入快照和结果定稿
  - name: AI / Agent
    description: ai-service｜有界分析任务；默认前端 Mock，真实模型需另行配置
  - name: AI / Quota
    description: ai-service｜按用户和上海日期统计的模型执行额度
  - name: Payment / Order
    description: payment-service｜演示套餐和模拟订单，不连接真实支付平台
  - name: Payment / Entitlement
    description: payment-service｜套餐权益，AI 用量由 ai-service 独立管理
  - name: Payment / Internal
    description: payment-service｜可信服务间权益查询，不经 Gateway 路由
security:
  - bearerAuth: []

paths:
  /api/base/v1/auth/wechat-login:
    post:
      tags: [Base / Auth]
      operationId: loginWithWechatCode
      x-service-owner: base-service
      security: []
      summary: 使用微信临时登录凭证登录
      description: |
        使用 wx.login 的一次性 code 向微信换取 OpenID，首次创建账号与资料，后续复用账号。
        返回 HS256 JWT（sub 为用户 UUID，含 iss/aud/iat/exp/jti），默认有效期两小时。
        不返回 OpenID 或 session_key；displayName 仅初始化新用户，avatarUrl 当前不保存。
        缺少微信或签名配置返回 503，不模拟登录成功。Gateway 已提供统一 JWT 验签与可信身份透传过滤器；真实部署和 Nacos 联调仍待验证。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/base/v1/users/me:
    get:
      tags: [Base / User]
      operationId: getCurrentUser
      x-service-owner: base-service
      summary: 获取当前用户基础资料
      description: 接收可信内部 X-User-Id；Gateway 已提供 JWT 校验、外部身份头清理与 sub 注入实现，真实部署和 Nacos 联调仍待验证。
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Base / User]
      operationId: updateCurrentUser
      x-service-owner: base-service
      summary: 修改当前用户基础资料
      description: |
        version 必填；未提供的字段保留，显式 null 清空。只传 version 时不写库、不递增版本。
        成功修改后 version 加一；陈旧版本返回 409。avatarPictureId 仅保存外部业务引用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: 修改后的资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/image/v1/pictures:
    post:
      tags: [Image / Picture]
      operationId: uploadPicture
      x-service-owner: image-service
      summary: 上传一个视觉来源
      description: |
        上传用户照片或 3D 固定视角快照。客户端多图选择后以有限并发逐张调用；
        `clientRequestId` 用于安全重试。原图进入 MinIO，数据库只保存元数据。
        `STANDARD_REFERENCE` 是系统预置资源，普通客户端通过标准图片列表读取而不是上传。
        `metadata` 首选使用 `application/json` part；也兼容 `uni.uploadFile` 的
        `formData.metadata = JSON.stringify(metadata)` 普通字符串字段，其内容仍须符合下方对象 schema。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/PictureUploadMetadata'
            encoding:
              metadata:
                contentType: application/json
      responses:
        '201':
          description: 图片已接收；异步处理可能仍在进行
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PictureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /api/image/v1/standard-pictures:
    get:
      tags: [Image / Picture]
      operationId: listStandardPictures
      x-service-owner: image-service
      summary: 获取系统提供的标准手部图片
      parameters:
        - name: handSide
          in: query
          schema: { $ref: '#/components/schemas/HandSide' }
        - name: view
          in: query
          schema: { $ref: '#/components/schemas/StandardPictureView' }
      responses:
        '200':
          description: 可用标准图片
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PictureResponse' }

  /api/image/v1/pictures/{pictureId}:
    parameters:
      - $ref: '#/components/parameters/PictureId'
    get:
      tags: [Image / Picture]
      operationId: getPicture
      x-service-owner: image-service
      summary: 获取图片元数据、处理状态和可访问 URL
      responses:
        '200':
          description: 图片详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PictureResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Image / Picture]
      operationId: deletePicture
      x-service-owner: image-service
      summary: 逻辑删除当前用户拥有的图片
      responses:
        '204':
          description: 已删除或此前已删除
        '404':
          $ref: '#/components/responses/NotFound'

  /api/image/v1/pictures/{pictureId}/annotation-set:
    parameters:
      - $ref: '#/components/parameters/PictureId'
    get:
      tags: [Image / Annotation]
      operationId: getPictureAnnotationSet
      x-service-owner: image-service
      summary: 获取图片的当前标注集
      parameters:
        - name: assessmentId
          in: query
          required: true
          description: 标准图片可被多人复用，必须以 Assessment 区分标注集。
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 当前标注集
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationSetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Image / Annotation]
      operationId: replacePictureAnnotationSet
      x-service-owner: image-service
      summary: 创建或整体替换图片标注集
      description: |
        使用 `version` 做乐观并发控制。所有坐标均以原图左上角为原点，归一化至
        `[0,1]`；服务端不得将红圈永久烧入唯一原图。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceAnnotationSetRequest'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationSetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /internal/image/visual-references/resolve:
    post:
      tags: [Image / Internal]
      operationId: resolveVisualReferences
      x-service-owner: image-service
      x-internal: true
      servers:
        - url: http://localhost:8082
          description: 直连 image-service；服务间通过注册发现调用，不经过 Gateway
      security: []
      summary: 批量校验并解析 Assessment 图片引用
      description: |
        仅供服务间调用。一次请求检查全部图片是否未删除、属于当前用户或为公共标准图，
        且状态为 AVAILABLE；任一图片不合法则整批失败，不静默丢弃。
        在同一只读快照内批量查询图片和当前用户/Assessment 的标注集，缺标注合法并返回 null。
        响应保持请求顺序，只返回业务 ID 和来源，不返回签名 URL、图形或图片内容。
        非空成功请求固定两次批量 SELECT，空数组不查询数据库并返回空数组。
        当前尚未实现服务身份认证，X-User-Id 必须来自可信内部调用链；
        /internal 路径本身不是认证机制。现有 Gateway 路由不转发此路径，部署时仍须限制服务端口访问。
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: 可信内部调用链传递的当前用户 ID，不是任意外部客户端可声明的身份。
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveVisualReferencesRequest'
      responses:
        '200':
          description: 全部校验通过，按请求顺序返回引用；空请求返回空数组。
          content:
            application/json:
              schema:
                type: array
                maxItems: 12
                items: { $ref: '#/components/schemas/ResolvedVisualReference' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /internal/image/agent-pictures/resolve:
    post:
      tags: [Image / Internal]
      operationId: resolveAgentPictures
      x-service-owner: image-service
      x-internal: true
      servers:
        - url: http://localhost:8082
          description: 直连 image-service；Gateway 不路由 /internal
      security: []
      summary: 批量读取 AI 所需的图片元数据和标注快照
      description: |
        仅可信内部服务调用；X-User-Id 不代替服务身份认证，部署时限制服务端口访问。
        校验公共标准图或当前用户归属、未删除、AVAILABLE 与有效尺寸；任一失败则整批失败。
        最多三次批量 SELECT，保持请求顺序，空数组不查询。包含完整标注形状与版本、3D viewState。
        originalUrl 为短期 GET 签名，仅供即时访问；AI 冻结输入时删除该字段，后续按 pictureId 重新获取。
      parameters:
        - $ref: '#/components/parameters/TrustedUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAgentPicturesRequest'
      responses:
        '200':
          description: 按请求顺序返回的图片与标注
          content:
            application/json:
              schema:
                type: array
                maxItems: 12
                items: { $ref: '#/components/schemas/ResolvedAgentPicture' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /internal/history/assessments/{assessmentId}/agent-input:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
      - $ref: '#/components/parameters/TrustedUserId'
    get:
      tags: [History / Internal]
      operationId: getAgentAssessmentInput
      x-service-owner: history-service
      x-internal: true
      servers:
        - url: http://localhost:8083
          description: 直连 history-service；Gateway 不路由 /internal
      security: []
      summary: 读取当前用户已提交 Assessment 的一致性输入
      description: |
        仅可信服务间调用，部署时限制服务端口访问。只读快照包含提交凭据、聚合视图和稳定输入摘要。
        DRAFT、CANCELLED 或无提交凭据返回 409；已完成记录允许创建新的分析任务。
        摘要覆盖基础症状、位置与视觉引用，不将追加答案、乐观版本或更新时间混入输入一致性判断。
      responses:
        '200':
          description: 提交凭据与 Assessment 聚合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAssessmentInputResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /internal/history/assessments/{assessmentId}/agent-results:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
      - $ref: '#/components/parameters/TrustedUserId'
    post:
      tags: [History / Internal]
      operationId: finalizeAgentAssessmentResult
      x-service-owner: history-service
      x-internal: true
      servers:
        - url: http://localhost:8083
          description: 直连 history-service；Gateway 不路由 /internal
      security: []
      summary: 幂等保存 Agent 定稿结果及当前结果投影
      description: |
        仅可信服务间调用，部署时限制服务端口访问。以 sessionId 去重，同 Session 异内容返回 409。
        锁定所属 Assessment，在一个 History 本地事务中追加结果历史、更新当前结果和完成状态。
        校验已提交凭据、稳定输入摘要与分析 attemptNo；旧任务不能覆盖已经定稿的新任务结果。
        sessionId/stepId/checkpointId 是跨服务业务引用，没有跨库外键。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeAgentResultRequest'
      responses:
        '200':
          description: 新定稿或幂等重放的同一个结果版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizedAgentResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/history/v1/assessments:
    post:
      tags: [History / Assessment]
      operationId: createAssessment
      x-service-owner: history-service
      summary: 创建手部症状 Assessment 草稿
      description: |
        可以先创建空草稿；进入下一步或提交前再校验首次必要输入是否完整。
        同一用户重试同一次创建意图时必须复用 `X-Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [History / Assessment]
      operationId: listAssessments
      x-service-owner: history-service
      summary: 分页查询当前用户的症状记录历史
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AssessmentStatus'
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 历史记录页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentPageResponse'

  /api/history/v1/assessments/{assessmentId}:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    get:
      tags: [History / Assessment]
      operationId: getAssessment
      x-service-owner: history-service
      summary: 获取 Assessment 完整详情
      responses:
        '200':
          description: Assessment 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [History / Assessment]
      operationId: updateAssessmentBasics
      x-service-owner: history-service
      summary: 更新首次采集的基础信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssessmentBasicsRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/history/v1/assessments/{assessmentId}/resume:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    get:
      tags: [History / Assessment]
      operationId: resumeAssessment
      x-service-owner: history-service
      summary: 获取继续填写所需的恢复视图
      description: |
        只读取当前用户的记录，不更新保存时间。完成记录返回 RESULT 步骤，取消记录返回 409。
        History 不反向调用 AI，activeAgentSessionId 仍返回 null。
        客户端通过 AI 的 GET /api/ai/v1/agent-sessions/active?assessmentId=... 独立找回未结束任务。
      responses:
        '200':
          description: 恢复视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResumeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/history/v1/assessments/{assessmentId}/symptom-locations:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    put:
      tags: [History / Assessment]
      operationId: replaceSymptomLocations
      x-service-owner: history-service
      summary: 整体替换稳定的粗粒度症状位置列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSymptomLocationsRequest'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SymptomLocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [History / Assessment]
      operationId: clearSymptomLocations
      x-service-owner: history-service
      summary: 清除当前粗粒度症状位置列表
      description: 更换手别或重新定位时使用；重复调用保持幂等。
      responses:
        '204':
          description: 已清除或原本不存在

  /api/history/v1/assessments/{assessmentId}/visual-references:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    put:
      tags: [History / Assessment]
      operationId: replaceVisualReferences
      x-service-owner: history-service
      summary: 替换 Assessment 关联的视觉来源列表
      description: |
        只保存 image-service 业务 ID，不建立跨数据库外键。请求中的 `version`
        用于确认客户端基于当前 Assessment 修改列表；该子资源 PUT 本身不递增
        `Assessment.version`，父资源版本只由基础信息 PATCH 或 submit 推进。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceVisualReferencesRequest'
      responses:
        '200':
          description: 当前视觉来源列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisualReference'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/history/v1/assessments/{assessmentId}/answers:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    post:
      tags: [History / Assessment]
      operationId: appendAssessmentAnswer
      x-service-owner: history-service
      summary: 追加一个可选或 Agent 动态问题答案
      description: |
        同一 Assessment 内 `clientAnswerId` 唯一，并作为答案写入的幂等标识；
        客户端重试同一次回答时必须复用该值。相同键与完整内容返回已存答案，改内容返回 409。
        `sequenceNumber` 在同一 Assessment 内唯一、允许间隔，不要求从 1 连续递增。
        新增答案要求已成功 submit；草稿或无提交凭据返回 409 ASSESSMENT_NOT_SUBMITTED。
        追加答案保留当前业务状态；已有答案的有效幂等重放不要求重新提交。
        新答案与根版本/保存时间在同一事务持久化；重放不重复写入，即使记录后来已经完成。
        本接口不产生下一问、不运行模型；source 是调用方提供的标签，不是执行 AI 的证明。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendAssessmentAnswerRequest'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/history/v1/assessments/{assessmentId}/submit:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    post:
      tags: [History / Assessment]
      operationId: submitAssessment
      x-service-owner: history-service
      summary: 提交当前 Assessment
      description: |
        仅改变 history-service 拥有的业务状态。后续由谁启动 AI、如何调用或降级，
        留给 Spring Cloud 学习阶段决定，本契约不固化编排。
        校验精简基础输入，以及至少一条粗定位或一张关联图片；症状类型不额外强制必填。
        仅推进到 AGENT 步骤，DRAFT 变为 COLLECTING，已有 COLLECTING/CLARIFYING 保留。
        不启动真实 Agent、不生成结果、不设置 COMPLETED/completedAt。
        使用内部提交凭据与请求 version 保证幂等，不以客户端可编辑的 currentStepKey 判断已提交。
        最近提交使用的旧版本重放，或没有后续修改时用提交后的当前版本再次提交，均不产生新副作用。
        有新修改时以最新版本重新校验提交；其他版本不匹配返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAssessmentRequest'
      responses:
        '200':
          description: 提交后的 Assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/history/v1/assessments/{assessmentId}/result:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    get:
      tags: [History / Result]
      operationId: getAssessmentResult
      x-service-owner: history-service
      summary: 获取最终业务结果
      description: |
        只读取当前用户已完成记录的持久化结果，保留 generatedBy、安全声明与最终时间。
        未完成或没有结果返回 404，不创建 Mock/规则/AI 结果。
      responses:
        '200':
          description: 辅助分析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResultResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/ai/v1/agent-sessions:
    post:
      tags: [AI / Agent]
      operationId: createAgentSession
      x-service-owner: ai-service
      summary: 幂等创建一次有限步骤分析任务
      description: |
        读取已提交的 Assessment，冻结基础信息、位置与图片标注输入，创建初始 Checkpoint。
        不隐式调用模型；客户端随后显式调用 advance。模型选择来自服务配置白名单。
        sourceSessionId/sourceCheckpointId 成对提供，用于从已结束任务的历史状态重新分析。
        相同幂等键及请求重放原任务，不重置预算；同一 Assessment 同时最多一个未结束任务。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentSessionRequest'
      responses:
        '201':
          description: 已创建或按幂等键重放的 Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/v1/agent-sessions/active:
    get:
      tags: [AI / Agent]
      operationId: getActiveSession
      x-service-owner: ai-service
      summary: 按 Assessment 查找当前用户的未结束任务
      description: |
        用于清理本地缓存或换设备后找回 Session ID。包含 CREATED、RUNNING、WAITING_FOR_USER、PAUSED、FAILED。
        只读，不自动恢复暂停/失败任务或启动模型。未找到返回 404；客户端仅在此 404 后允许创建新任务。
        不需要 History 调用 AI；客户端直接查询当前服务持有的任务状态。
      parameters:
        - name: assessmentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 当前未结束 Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/ai/v1/agent-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [AI / Agent]
      operationId: getAgentSession
      x-service-owner: ai-service
      summary: 读取当前分支状态、版本与检查点
      description: 只读，不隐式调用模型、恢复暂停任务或接管运行中的执行。
      responses:
        '200':
          description: 当前 Session 视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionResponse'
        '404':

    post:
      tags: [AI / Agent]
      operationId: pauseAgentSession
      x-service-owner: ai-service
      summary: 暂停当前分析
      description: 保留最近已提交的 Checkpoint，递增执行代次使旧响应失效；不保证供应商立即停止已经发出的模型请求。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentVersionRequest'
